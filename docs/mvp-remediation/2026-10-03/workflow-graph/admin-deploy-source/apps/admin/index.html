<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Nilaza Admin</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg">
    <link rel="stylesheet" href="./shell.css" />
  </head>
  <body>
    <section class="login-screen" id="login-screen">
      <div class="login-panel">
        <div class="brand-mark"><img src="./assets/brand/v1/logo/symbol-ivory.svg" alt="Nilaza"></div>
        <p class="brand-name"><img src="./assets/brand/v1/logo/wordmark-ivory.svg" width="160" alt="Nilaza"></p>
        <h1>Admin workspace</h1>
        <p class="login-copy">Manage app content and AI configuration in one protected shared online workspace.</p>
        <form id="login-form">
          <label>Email<input id="login-email" type="email" autocomplete="username" required /></label>
          <label>Password<input id="login-password" type="password" autocomplete="current-password" required /></label>
          <button type="submit" class="primary">Sign in</button>
        </form>
        <a class="secondary recovery-back" href="./recovery.html">Quên mật khẩu? / Forgot password?</a>
        <p class="form-error" id="login-error" aria-live="polite"></p>
        <div class="demo-accounts" id="demo-accounts"></div>
      </div>
    </section>

    <section class="access-screen" id="access-screen" hidden>
      <div class="login-panel">
        <div class="brand-mark"><img src="./assets/brand/v1/logo/symbol-ivory.svg" alt="Nilaza"></div>
        <h1>Admin access required</h1>
        <p>This account can use the mobile app but cannot open admin datasets or release controls.</p>
        <button class="secondary" id="try-another-account">Use another account</button>
      </div>
    </section>

    <div class="admin-shell" id="admin-shell" hidden>
      <header class="shell-header">
        <div class="shell-brand">
          <div class="brand-mark small"><img src="./assets/brand/v1/logo/symbol-ivory.svg" alt="Nilaza"></div>
          <div><strong>Nilaza Admin</strong><span>Shared online workspace</span></div>
        </div>
        <nav class="workspace-nav" id="workspace-nav" aria-label="Admin workspaces"></nav>
        <div class="account-area">
          <span id="account-role"></span>
          <button class="secondary compact" id="logout-button">Log out</button>
        </div>
      </header>
      <div class="route-bar" id="route-bar" aria-label="Workspace sections"></div>
      <main class="workspace-frame-wrap">
        <div id="workspace-frames" aria-live="off"></div>
      </main>
    </div>

    <script src="./config.js?v=admin-sync-v1"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="./admin-access.js"></script>
    <script src="./shell.js"></script>
  </body>
</html>
