<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Nilaza Admin</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg">
    <link rel="stylesheet" href="./shell.css" />
  </head>
  <body>
    <section class="login-screen" id="login-screen">
      <div class="login-panel">
        <div class="brand-mark"><img src="./assets/brand/v1/logo/symbol-ivory.svg" alt="Nilaza"></div>
        <p class="brand-name"><img src="./assets/brand/v1/logo/wordmark-ivory.svg" width="160" alt="Nilaza"></p>
        <h1>Trang quản trị</h1>
        <p class="login-copy">Quản lý nội dung app và cấu hình AI trong một khu làm việc trực tuyến có bảo vệ.</p>
        <form id="login-form">
          <label for="login-email">Email<input id="login-email" type="email" autocomplete="username" required /></label>
          <label for="login-password">Mật khẩu<input id="login-password" type="password" autocomplete="current-password" required /></label>
          <button type="submit" class="primary">Đăng nhập</button>
        </form>
        <a class="secondary recovery-back" href="./recovery.html">Quên mật khẩu?</a>
        <p class="form-error" id="login-error" role="alert" aria-live="polite"></p>
        <div class="demo-accounts" id="demo-accounts"></div>
      </div>
    </section>

    <section class="access-screen" id="access-screen" hidden>
      <div class="login-panel">
        <div class="brand-mark"><img src="./assets/brand/v1/logo/symbol-ivory.svg" alt="Nilaza"></div>
        <h1>Chưa có quyền quản trị</h1>
        <p>Tài khoản này đăng nhập được app nhưng chưa có quyền quản trị. Nhờ Owner cấp quyền hoặc dùng tài khoản khác.</p>
        <button class="secondary" id="try-another-account">Dùng tài khoản khác</button>
      </div>
    </section>

    <div class="admin-shell" id="admin-shell" hidden>
      <header class="shell-header">
        <div class="shell-brand">
          <div class="brand-mark small"><img src="./assets/brand/v1/logo/symbol-ivory.svg" alt="Nilaza"></div>
          <div><strong>Nilaza Admin</strong><span>Khu làm việc trực tuyến</span></div>
        </div>
        <nav class="workspace-nav" id="workspace-nav" aria-label="Khu làm việc"></nav>
        <div class="account-area">
          <span class="unsaved-indicator" id="unsaved-indicator" role="status" aria-live="polite" hidden></span>
          <span id="account-role"></span>
          <button class="secondary compact" id="logout-button">Đăng xuất</button>
        </div>
      </header>
      <p class="session-expiry-notice" id="session-expiry-notice" role="alert" hidden></p>
      <nav class="route-bar" id="route-bar" aria-label="Mục trong khu làm việc"></nav>
      <main class="workspace-frame-wrap">
        <div id="workspace-frames" aria-live="off"></div>
      </main>
    </div>

    <script src="./config.js?v=admin-sync-v1"></script>
    <script src="./env-band.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.108.2"></script>
    <script src="./admin-access.js"></script>
    <script src="./unsaved-changes.js"></script>
    <script src="./shell.js"></script>
  </body>
</html>
