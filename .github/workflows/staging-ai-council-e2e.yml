name: Staging AI Council E2E

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  authenticated-council-e2e:
    name: Authenticated AI Council staging check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: staging
    env:
      NILAZA_E2E_SUPABASE_URL: ${{ secrets.NILAZA_E2E_SUPABASE_URL }}
      NILAZA_E2E_SUPABASE_ANON_KEY: ${{ secrets.NILAZA_E2E_SUPABASE_ANON_KEY }}
      NILAZA_E2E_EMAIL: ${{ secrets.NILAZA_E2E_EMAIL }}
      NILAZA_E2E_PASSWORD: ${{ secrets.NILAZA_E2E_PASSWORD }}
      NILAZA_E2E_COUNCIL_INPUT_JSON: ${{ secrets.NILAZA_E2E_COUNCIL_INPUT_JSON }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Verify the Council contract artifact
        run: npm run council:contract:check

      - name: Run authenticated staging scenario
        run: npm run e2e:ai-council:staging
