name: Admin quality

on:
  pull_request:
    paths:
      - "apps/admin/**"
      - "packages/agent-config/**"
      - "packages/content/data/**"
      - "packages/content/generated/**"
      - "scripts/admin-*.mjs"
      - "scripts/build-admin-seed.mjs"
      - "scripts/build-admin-owner-guide.mjs"
      - "scripts/validate-admin-contract.mjs"
      - "scripts/validate-backend-contracts.mjs"
      - "scripts/validate-repo-skills.mjs"
      - "skills/**"
      - "supabase/functions/**"
      - "supabase/migrations/**"
      - "supabase/seed.generated.sql"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/admin-quality.yml"
  push:
    branches:
      - main
    paths:
      - "apps/admin/**"
      - "packages/agent-config/**"
      - "packages/content/data/**"
      - "packages/content/generated/**"
      - "scripts/admin-*.mjs"
      - "scripts/build-admin-seed.mjs"
      - "scripts/build-admin-owner-guide.mjs"
      - "scripts/validate-admin-contract.mjs"
      - "scripts/validate-backend-contracts.mjs"
      - "scripts/validate-repo-skills.mjs"
      - "skills/**"
      - "supabase/functions/**"
      - "supabase/migrations/**"
      - "supabase/seed.generated.sql"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/admin-quality.yml"

permissions:
  contents: read

jobs:
  admin-quality:
    name: Admin contract and regression checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Validate Admin contract
        run: npm run admin:check

      - name: Run Admin regression tests
        run: npm run admin:test

      - name: Validate backend contracts
        run: npm run validate:backend

      - name: Validate agent governance
        run: npm run validate:governance

      - name: Validate repository skills
        run: npm run skills:validate

      - name: Check Supabase readiness
        run: npm run supabase:check

      - name: Check recorded migration ledger
        run: npm run supabase:migration-ledger:check
