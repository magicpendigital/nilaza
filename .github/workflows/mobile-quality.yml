name: Mobile quality

on:
  pull_request:
    paths:
      - "apps/mobile/**"
      - "packages/content/data/**"
      - "packages/astrology-core/**"
      - "packages/ai-contracts/**"
      - "scripts/*astrology*.mjs"
      - "packages/agent-config/**"
      - "assets/**"
      - "scripts/generate-council-contract.mjs"
      - "scripts/validate-data.mjs"
      - "scripts/validate-agent-governance.mjs"
      - "scripts/validate-mobile-release-config.mjs"
      - "supabase/functions/_shared/council-contract.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/mobile-quality.yml"
  push:
    branches:
      - main
    paths:
      - "apps/mobile/**"
      - "packages/content/data/**"
      - "packages/astrology-core/**"
      - "packages/ai-contracts/**"
      - "scripts/*astrology*.mjs"
      - "packages/agent-config/**"
      - "assets/**"
      - "scripts/generate-council-contract.mjs"
      - "scripts/validate-data.mjs"
      - "scripts/validate-agent-governance.mjs"
      - "scripts/validate-mobile-release-config.mjs"
      - "supabase/functions/_shared/council-contract.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/mobile-quality.yml"

permissions:
  contents: read

concurrency:
  group: mobile-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mobile-quality:
    name: Mobile type, tests and embedded bundles
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Validate mobile source and config data
        run: |
          npm run mobile:check
          npm --workspace apps/mobile test -- --runInBand
          npm run validate:data
          npm run validate:astrology
          npm run validate:visual-assets
          npm run astrology:contract:check
          npm run astrology:core:test
          npm run astrology:accuracy:check
          npm run astrology:grid:check
          npm run council:contract:check
          npm run validate:governance
          npm run supabase:migration-ledger:check
          npm run mobile:release:config:check

      - name: Export the Metro web bundle
        working-directory: apps/mobile
        env:
          NODE_ENV: production
        run: npx expo export --platform web --output-dir .ci-web-export

      - name: Verify the web export
        run: |
          npm run validate:mobile-export -- apps/mobile/.ci-web-export
          find apps/mobile/.ci-web-export/_expo/static/js/web -type f -name '*.js' -size +0c | grep -q .

      - name: Export the Android embedded bundle
        working-directory: apps/mobile
        env:
          NODE_ENV: production
        run: >-
          npx expo export:embed --entry-file index.js --platform android --dev false
          --bundle-output .ci-native/index.android.bundle
          --sourcemap-output .ci-native/index.android.bundle.map
          --assets-dest .ci-native/assets

      - name: Verify native bundle output
        run: |
          test -s apps/mobile/.ci-native/index.android.bundle
          test -d apps/mobile/.ci-native/assets
